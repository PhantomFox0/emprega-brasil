services:
  mysql:
    image: mysql:8.4
    container_name: perfil_mysql
    profiles: ["local"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-perfil_db}
      MYSQL_USER: ${DB_USER:-perfil_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-perfil_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perfil_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:?defina DB_HOST no .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-perfil_user}
      DB_PASSWORD: ${DB_PASSWORD:-perfil_password}
      DB_NAME: ${DB_NAME:-perfil_db}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_CA: ${DB_SSL_CA:-certs/global-bundle.pem}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src:/usr/src/app/src
      - ./fotos:/usr/src/app/fotos

volumes:
  mysql_data:
